<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/leftNav/leftNav.css">
    <link rel="stylesheet" href="/static/linkme/linkme.css">
    <title>Document</title>
</head>
<body>
    <div class="arrange">
        {% include "components/leftNav.html" %}
        {% include "components/message.html" %}
        <div class="linkMeSection">
            <div class="linkMeBanner">配對成功</div>
            <div class="linkMeMainBlock">
                <img id="linkMeAvatar">
                <div id="linkMeUserName"></div>
                <div class="bioBlock">
                    <div>個人簡介:</div>
                    <div id="linkMeBio"></div>
                </div>
                <div class="selectBlock">
                    <div class="linkMeBtn" id="linkMeBtn">追蹤</div>
                    <div class="linkMeBtn" id="rejectBtn">遺憾拒絕</div>
                    <div id="missSection">期待下次有緣分能再與你相見</div>
                </div>
                <div id="doubleOp">已經追蹤這位朋友，請不要三心二意~</div>
            </div>
        </div>
        {% include "components/chat.html" %}
    </div>
    <dialog id="rejectPopUp">
        <img src="/static/image/heart_broken.png" id="rejectPopUpImg">
        <div class="linkMeCaption">要與這段緣分說再見嗎?</div>
        <div class="RejectMeBanner">確認後，今天將不會再次推薦這位朋友</div>
        <div class="decideLink">
            <div id="thinkTwice">再想想</div>
            <div id="goodBye">確定拒絕</div>
        </div>
    </dialog>
</body>
<script src="/static/linkme/linkme.js"></script>
</html>
