<head>
    <link rel="stylesheet" href="/static/chat/chat.css">
</head>

<div class="chatBox">
    <span class="chatNotificationDot" id="chatNotificationDot"></span>
    <img class="chatIcon" src="/static/image/message.png">
    <div class="chatBanner">訊息</div>
</div>


<div class="chatWindow" id="chatWindow">

    <!-- 聊天室標題 -->
    <div class="chatWindowHeader">
        <div class="chatWindowTitle">LinkMe 訊息</div>
        <button type="button" id="chatCloseBtn">✕</button>
    </div>

    <div class="chatWindowBody">

        <!-- 左側：聊天列表 -->
        <div class="chatSidebar">
            <div class="chatSidebarTitle">聊天列表</div>

            <div id="chatConversationList">
                <!-- JavaScript 動態加入聊天對象 -->
            </div>
        </div>

        <!-- 右側：聊天內容 -->
        <div class="chatMain">

            <div class="chatMainHeader" id="chatMainHeader">
                請選擇一個聊天對象
            </div>

            <div class="chatMessages" id="chatMessages">
                <!-- JavaScript 動態加入訊息 -->
            </div>

            <form class="chatInputArea" id="chatInputForm">
                <input type="text" id="chatMessageInput" placeholder="輸入訊息..." maxlength="5000" autocomplete="off" disabled>

                <button type="submit" id="chatSendBtn" disabled>傳送</button>
            </form>

        </div>
    </div>
</div>

<script src="/static/chat/chat.js"></script>
