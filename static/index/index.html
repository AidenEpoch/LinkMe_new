<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/index/index.css">
    <link rel="stylesheet" href="/static/leftNav/leftNav.css">
    <title>Document</title>
</head>
<body>
    <div class="arrange">  <!--首頁的畫面配置: 左導覽   主要內容(貼文等等)  右導覽(推薦、社群(社群推薦)等等)-->


        
        <!--左邊部分的固定式導覽列-->
        <nav class="leftNavShow" id="leftNavShow">
            <div class="logoBlock">
                <img src="/static/image/LinkMeIcon.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/post.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/club.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/search.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/LinkMeBtn.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/message.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/avatar_default.png" class="navIcon">
            </div>

        </nav>

        <nav class="leftNavHidden" id="leftNavHidden">
            <div class="logoBlock">
                <img src="/static/image/LinkMeIcon.png" class="navIcon" id="homePageIcon">
            </div>

            <div class="navBlockHidden" id="postBlock">
                <img src="/static/image/post.png" class="navIcon">
                <div class="navBanner">建立</div>
            </div>

            <div class="navBlockHidden" id="clubBlock">
                <img src="/static/image/club.png" class="navIcon">
                <div class="navBanner">社群</div>
            </div>

            <div class="navBlockHidden" id="searchBlock">
                <img src="/static/image/search.png" class="navIcon">
                <div class="navBanner">搜尋</div>
            </div>

            <div class="navBlockHidden" id="linkMeBlock">
                <img src="/static/image/LinkMeBtn.png" class="navIcon">
                <div class="navBanner">LinkMe</div>
            </div>

            <div class="navBlockHidden" id="messageBlock">
                <img src="/static/image/message.png" class="navIcon">
                <div class="navBanner">通知</div>
            </div>

            <div class="navBlockHidden" id="userBlock">
                <img src="/static/image/avatar_default.png" class="navIcon">
                <div class="navBanner">個人檔案</div>
            </div>

        </nav>

        <!-- 左導覽列的互動式視窗 -->
        <dialog id="postDialog" class="postWindow">
            <img src="/static/image/close.png" class="closeDialog" id="closePostWindow"></img>
            <div class="postDialogBanner">建立新貼文</div>
            <hr style="color: rgba(177, 176, 176, 0.3);">
            <div class="postIntro">
                <img src="/static/image/imageAndVideo.png" class="postUploadIcon">
                <label for="uploadBtn" class="uploadBtn">從電腦選取</label>
                <input type="file" id="uploadBtn" hidden accept="image/*, video/*"></input>
            </div>
        </dialog>
        <!-- 左導覽列的互動式視窗  結束-->

        <!--以上為左邊的導覽列-->




        <!--主要內容區-->
        <div class="mainSection">
            <div class="friendStatusContainer">
                <div>
                    <div style="width: 100px; height: 100px; border-radius: 50%; border: 1px gray solid; margin-bottom: 30px;"></div>
                </div>
            </div>
            <div class="postContainer">空白</div>
        </div>
        <!--以上為主要內容區-->

        <!--右導覽列-->
        <nav class="rightNav">
            <div class="userAndAvatarBlock">
                <img src="/static/image/avatar_default.png" style="width: 60px; height: 60px;">
                <div id="user_name" class="user_name"></div>
            </div>
            <div>為你推薦</div>
        </nav>
        <!--以上為右導覽列-->
    </div>
    
</body>
<script src="/static/index/index.js"></script>
<script src="/static/leftNav/leftNav.js"></script>
</html>
