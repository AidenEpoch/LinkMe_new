<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/user/user.css">
    <link rel="stylesheet" href="/static/leftNav/leftNav.css">
    <title>Document</title>
</head>
<body>
    <div class="userSection">

        <!--左邊部分的固定式導覽列-->
        <nav class="leftNavShow" id="leftNavShow">
            <div class="logoBlock">
                <img src="/static/image/LinkMeIcon.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/post.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/club.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/search.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/LinkMeBtn.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/message.png" class="navIcon">
            </div>

            <div class="navBlock">
                <img src="/static/image/avatar_default.png" class="navIcon">
            </div>

        </nav>

        <nav class="leftNavHidden" id="leftNavHidden">
            <div class="logoBlock">
                <img src="/static/image/LinkMeIcon.png" class="navIcon" id="homePageIcon">
            </div>

            <div class="navBlockHidden" id="postBlock">
                <img src="/static/image/post.png" class="navIcon">
                <div class="navBanner">建立</div>
            </div>

            <div class="navBlockHidden" id="clubBlock">
                <img src="/static/image/club.png" class="navIcon">
                <div class="navBanner">社群</div>
            </div>

            <div class="navBlockHidden" id="searchBlock">
                <img src="/static/image/search.png" class="navIcon">
                <div class="navBanner">搜尋</div>
            </div>

            <div class="navBlockHidden" id="linkMeBlock">
                <img src="/static/image/LinkMeBtn.png" class="navIcon">
                <div class="navBanner">LinkMe</div>
            </div>

            <div class="navBlockHidden" id="messageBlock">
                <img src="/static/image/message.png" class="navIcon">
                <div class="navBanner">通知</div>
            </div>

            <div class="navBlockHidden" id="userBlock">
                <img src="/static/image/avatar_default.png" class="navIcon">
                <div class="navBanner">個人檔案</div>
            </div>

            <div class="navBlockHidden logoutBlock" id="logoutBlock">
                <img src="/static/image/logout.png" class="navIcon">
                <div class="navBanner">登出</div>
            </div>

        </nav>

        <!-- 左導覽列的貼文互動式視窗 -->
        <dialog id="postDialog" class="postWindow">
            <img src="/static/image/close.png" class="closeDialog" id="closePostWindow"></img>
            <div class="postDialogBanner">建立新貼文</div>
            <hr style="color: rgba(177, 176, 176, 0.3);">
            <div class="postIntro">
                <img src="/static/image/imageAndVideo.png" class="postUploadIcon">
                <label for="uploadBtn" class="uploadBtn">從電腦選取</label>
                <input type="file" id="uploadBtn" hidden accept="image/*, video/*"></input>
            </div>
        </dialog>

        <dialog id="postDialogNext" class="postWindow">
            <img src="/static/image/close.png" class="closeDialog" id="closePostWindowNext"></img>
            <div class="previewBanner">
                <img src="/static/image/return.png" id="returnToFirst" style="width: 24px; height: 20px; cursor: pointer; display: flex; justify-content: flex-start; align-items: center;">
                <div style="margin-left: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500;">預覽圖片</div>   
                <div id="goToNextStep" class="goToNextStep">下一步</div>
            </div>
            <hr>
            <div>
                <div id="postPreview" alt="預覽圖片" class="postPreview"></div>
            </div>
        </dialog>
        <dialog id="postDialogLast" class="postWindowFinal">
            <img src="/static/image/close.png" class="closeDialog" id="closePostWindowLast"></img>
            <div class="previewBanner">
                <img src="/static/image/return.png" id="returnToSecond" style="width: 24px; height: 20px; cursor: pointer; display: flex; justify-content: flex-start; align-items: center;">
                <div style="margin-left: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500;">預覽貼文</div>   
                <div id="postTheCreate" class="goToNextStep">發布</div>
            </div>
            <hr>
            <div class="postPageArr">
                <div id="previewBeforePost" alt="預覽圖片" class="postPreview"></div>
                <div class="postContentSection">
                    <div>用戶</div>
                    <div class="postInputContainer">
                        <textarea id="postContent" class="postContentInput" placeholder="分享點什麼吧!"  maxlength="2200"></textarea>
                        <div id="remainingCount" class="remainingCount">
                            0 / 2200
                        </div>
                    </div>
                </div>
            </div>
        </dialog>
        <!-- 左導覽列的貼文互動式視窗  結束-->

        <!--以上為左邊的導覽列-->

        <!--中間內容-->
        <div class="mainSection"> 
            <div class="mainUpper">
                <div class="avatarAndOther">
                    <div class="avatar_img"></div>
                    <div class="nameAndBio">
                        <div class="name" id="avatar_name">Name</div>
                        <div class="Fans">
                            <div>貼文</div>
                            <div>位粉絲</div>
                            <div>追蹤中</div>
                        </div>
                        <div>
                            <div>寫點甚麼吧</div>
                        </div>
                    </div>
                </div>
                <div class="functionBtn">
                    <div class="editProfile" id="editProfileBtn">
                        <div>編輯個人檔案</div>
                    </div>
                    <div class="readStore" id="readStoreBtn">
                        <div>查看典藏</div>
                    </div>
                </div>
                <div class="threads">
                    <div class="thread"></div>
                </div>
            </div>
            <div class="postContainer" id="postContainer">
                <div id="userPostGrid" class="userPostGrid"></div>
            </div>
            <hr>
        </div>
        <!--中間內容結束-->
    </div>
</body>

<script src="/static/user/user.js"></script>
<script src="/static/leftNav/leftNav.js"></script>
</html>
